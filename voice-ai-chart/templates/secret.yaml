{{- if and (not .Values.groq.existingSecret) .Values.groq.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "voice-ai.groqSecretName" . }}
  labels:
    app: {{ include "voice-ai.name" . }}
type: Opaque
stringData:
  {{ .Values.groq.secretKey }}: {{ .Values.groq.apiKey | quote }}
{{- end }}
{{- if and (not .Values.google.existingSecret) (or .Values.google.userEmail .Values.google.appPassword) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "voice-ai.googleSecretName" . }}
  labels:
    app: {{ include "voice-ai.name" . }}
type: Opaque
stringData:
  {{ .Values.google.userEmailKey }}: {{ .Values.google.userEmail | quote }}
  {{ .Values.google.appPasswordKey }}: {{ .Values.google.appPassword | quote }}
{{- end }}
