{{- if and (not .Values.groq.existingSecret) .Values.groq.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "voice-ai.groqSecretName" . }}
  labels:
    app: {{ include "voice-ai.name" . }}
type: Opaque
stringData:
  {{ .Values.groq.secretKey }}: {{ .Values.groq.apiKey | quote }}
{{- end }}
