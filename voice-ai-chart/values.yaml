replicaCount: 1

grpc:
  replicaCount: 1

audioWorker:
  replicaCount: 1

ttsWorker:
  replicaCount: 1

xtts:
  enableInitContainer: true

gpu:
  grpc: 1
  ttsWorker: 1
  timeSlicing:
    enabled: true
    namespace: gpu-operator-resources
    profile: any
    replicas: 2

volumeMounts:
  xttsModel:
    name: xtts-model
    mountPath: /app/models/xtts

  whisperModel:
    name: whisper-model
    mountPath: /app/models/whisper

volumeClaim:
  name: xtts-model-pvc
  whisperName: whisper-model-pvc

image:
  repository: huzaifagill234/voice-ai-web
  tag: ci-v1.2.0

groq:
  existingSecret: ""
  secretKey: GROQ_API_KEY
  apiKey: ""
  imagePullPolicy: Always

google:
  existingSecret: ""
  userEmailKey: GOOGLE_USER_EMAIL
  appPasswordKey: GOOGLE_APP_PASSWORD
  userEmail: ""
  appPassword: ""

e2e:
  image:
    repository: huzaifagill234/e2e-runner
    tag: ci
    pullPolicy: IfNotPresent
  env:
    HTTP_BASE: "http://voice-ai:8000/api"
    HTTP_BASE_HEALTH: "http://voice-ai:8000"
    WS_URL: "ws://voice-ai:8000/ws/audio/"

pgbouncer:
  enabled: true
  replicaCount: 1
  service:
    port: 6432
  config:
    adminUser: pgbouncer
    adminPassword: pgbouncer
    databases:
      voice_ai_db:
        host: voice-ai-postgresql
        port: 5432
        dbname: voice_ai_db
        user: postgres
        password: postgres
    userlist:
      postgres: postgres
    pgbouncer:
      auth_type: md5
      pool_mode: transaction
      default_pool_size: "20"
      max_client_conn: "200"
      ignore_startup_parameters: extra_float_digits

env:
  POSTGRES_HOST: voice-ai-pgbouncer
  POSTGRES_DB: voice_ai_db
  POSTGRES_PORT: 6432
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  REDIS_HOST: voice-ai-redis-master
  REDIS_URL: redis://voice-ai-redis-master:6379/0
  RABBITMQ_HOST: voice-ai-rabbitmq
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: guest
  RABBITMQ_URL: amqp://guest:guest@voice-ai-rabbitmq:5672//
  ALLOWED_HOSTS: "voice-ai,voice-ai.default.svc.cluster.local,localhost,127.0.0.1"
  GRPC_DEPLOYMENT_TYPE: remote
  ENVIRONMENT: infra-test
  OTEL_SERVICE_NAME: voice-ai
  OTEL_EXPORTER_OTLP_ENDPOINT: http://opentelemetry-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=infra-test
  WHISPER_MODEL_PATH: /app/models/whisper/large-v3.pt

postgresql:
  auth:
    username: postgres
    password: postgres
    database: voice_ai_db

redis:
  image:
    repository: bitnamilegacy/redis
    tag: 7.2.4-debian-12-r9
  auth:
    enabled: false

rabbitmq:
  image:
    repository: bitnamilegacy/rabbitmq
    tag: 3.12.12-debian-11-r8
  auth:
    username: guest
    password: guest

service:
  type: ClusterIP
  port: 8000

kube-prometheus-stack:
  enabled: true

  # no alerting wired up, and it saves ~1 pod of memory on a single node
  alertmanager:
    enabled: false

  grafana:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    ingress:
      enabled: true
      ingressClassName: nginx
      path: /grafana
      pathType: Prefix

  prometheus:
    ingress:
      enabled: true
      ingressClassName: nginx
      paths:
        - /prometheus
    prometheusSpec:
      # short local retention; Thanos takes over long-term storage to S3
      retention: 24h
      resources:
        requests:
          cpu: 200m
          memory: 768Mi
        limits:
          memory: 2Gi

      externalLabels:
        cluster: voice-ai

      thanos:
        objectStorageConfig:
          existingSecret:
            name: thanos-objstore
            key: objstore.yml

loki:
  enabled: true
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    storage:
      type: s3
      bucketNames:
        chunks: voice-ai-loki
        ruler: voice-ai-loki
        admin: voice-ai-loki
      s3:
        region: us-east-1
    limits_config:
      retention_period: 168h
      allow_structured_metadata: true

  singleBinary:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

  # single node: no scalable components, memcached caches, gateway, canary,
  # test, or the bundled minio
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  gateway:
    enabled: false
  minio:
    enabled: false

tempo:
  enabled: true

  tempo:
    storage:
      trace:
        backend: s3
        s3:
          bucket: voice-ai-tempo
          endpoint: s3.us-east-1.amazonaws.com
          region: us-east-1
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

  persistence:
    enabled: false

thanos:
  enabled: true

  image:
    repository: bitnamilegacy/thanos

  existingObjstoreSecret: thanos-objstore

  query:
    enabled: true
    replicaCount: 1
    dnsDiscovery:
      enabled: true
      sidecarsService: voice-ai-kube-prometheus-stack-thanos-discovery
      sidecarsNamespace: voice-ai
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

  storegateway:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

  compactor:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

  # not needed for a single-Prometheus setup
  queryFrontend:
    enabled: false
  receive:
    enabled: false
  ruler:
    enabled: false
  bucketweb:
    enabled: false

ingress-nginx:
  enabled: true

  controller:
    service:
      type: LoadBalancer

whisper:
  enableInitContainer: true

opentelemetry-collector:
  enabled: true

  # the app exports to http://opentelemetry-collector:4317, so pin the service
  # name to match (otherwise it would be voice-ai-opentelemetry-collector)
  fullnameOverride: opentelemetry-collector

  mode: deployment

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      filelog:
        include:
          - /var/log/app/*.log
        start_at: beginning

        operators:
          - type: regex_parser
            regex: '^(?P<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) \| (?P<level>\w+) \| (?P<logger>[^|]+) \| (?P<message>.*)$'

            timestamp:
              parse_from: attributes.time
              layout: "%Y-%m-%d %H:%M:%S"

            severity:
              parse_from: attributes.level

          - type: move
            from: attributes.message
            to: body

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25

      batch:
        send_batch_size: 1024
        timeout: 10s

      attributes:
        actions:
          - action: upsert
            key: service.name
            value: voice-ai

          - action: upsert
            key: service.namespace
            value: voice-ai

          - action: upsert
            key: deployment.environment
            value: infra-test

    exporters:
      otlp/tempo:
        endpoint: voice-ai-tempo:4317
        tls:
          insecure: true

      prometheus:
        endpoint: "0.0.0.0:8889"

      otlphttp/loki:
        endpoint: http://voice-ai-loki:3100/otlp

      debug: {}

    service:
      telemetry:
        logs:
          level: info

      pipelines:
        traces:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
            - attributes
          exporters:
            - otlp/tempo
            - debug

        logs:
          receivers:
            - otlp
            - filelog
          processors:
            - memory_limiter
            - batch
            - attributes
          exporters:
            - otlphttp/loki
            - debug

        metrics:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
            - attributes
          exporters:
            - prometheus
            - debug
            