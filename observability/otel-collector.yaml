receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

  filelog:
    include:
      - /var/log/app/*.log
    start_at: beginning

    operators:
      - type: regex_parser
        regex: '^(?P<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) \| (?P<level>\w+) \| (?P<logger>[^|]+) \| (?P<message>.*)$'

        timestamp:
          parse_from: attributes.time
          layout: "%Y-%m-%d %H:%M:%S"

        severity:
          parse_from: attributes.level


      - type: move
        from: attributes.message
        to: body

  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector
          static_configs:
            - targets: ["otel-collector:8888"]

        - job_name: voice-ai-web
          metrics_path: /metrics/
          static_configs:
            - targets: ["voice-ai-web:8000"]

processors:
  batch:

  attributes:
    actions:
      - key: service.name
        value: voice-ai-backend
        action: upsert

exporters:
  otlp:
    endpoint: tempo:4317
    tls:
      insecure: true

  debug:

  otlphttp/loki:
      endpoint: http://loki:3100/otlp
      tls:
        insecure: true

service:
  telemetry:
    logs:
      level: info

  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, attributes]
      exporters: [otlp, debug]

    logs:
      receivers: [otlp, filelog]
      processors: [batch, attributes]
      exporters: [debug, otlphttp/loki]

    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [debug]
