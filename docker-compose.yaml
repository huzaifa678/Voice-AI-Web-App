version: "3.9"

services:
  web:
    image: voice-ai-web:latest
    container_name: voice-ai-web
    command: >
      sh -c "
      ./wait-for-it.sh postgres:5432 --strict --timeout=60 &&
      ./wait-for-it.sh redis:6379 --strict --timeout=60 &&
      ./wait-for-it.sh rabbitmq:5672 --strict --timeout=60 &&
      ./start.sh
      "

    working_dir: /app/voiceAI
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      LOG_FILE: "/var/log/app/app.log"
    volumes:
      - app_logs:/var/log/app
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - tempo
      - otel-collector
    networks:
      - voice-ai-net

  postgres:
    image: postgres:16
    container_name: voice-ai-postgres
    environment:
      POSTGRES_DB: voice_ai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - voice-ai-net

  pgbouncer:
    image: edoburu/pgbouncer
    container_name: pgbouncer
    depends_on:
      - postgres
    ports:
      - "6432:6432"
    networks:
      - voice-ai-net
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt

  redis:
    image: redis:7
    container_name: voice-ai-redis
    ports:
      - "6379:6379"
    networks:
      - voice-ai-net

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: voice-ai-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   
      - "15672:15672"
    networks:
      - voice-ai-net

  tempo:
    image: grafana/tempo:2.6.1
    container_name: voice-ai-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
    networks:
      - voice-ai-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: voice-ai-otel-collector
    command: [ "--config=/etc/otel-collector.yaml" ]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel-collector.yaml
      - app_logs:/var/log/app
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    depends_on:
      - tempo
      - loki
    networks:
      - voice-ai-net

  loki:
    image: grafana/loki:6.0.0
    container_name: voice-ai-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - voice-ai-net

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: voice-ai-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - voice-ai-net

  grafana:
    image: grafana/grafana-enterprise:11.2.0
    container_name: voice-ai-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_DOMAINS=public
      - GF_FEATURE_TOGGLES=exploretogray
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - loki
      - prometheus
    networks:
      - voice-ai-net

volumes:
  postgres_data:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
  app_logs:

networks:
  voice-ai-net:
    driver: bridge
