version: "3.9"

services:
  web:
    image: voice-ai-web:v1.0.1
    container_name: voice-ai-web
    command: >
      sh -c "
      ./wait-for-it.sh postgres:5432 --strict --timeout=60 &&
      ./wait-for-it.sh redis:6379 --strict --timeout=60 &&
      ./wait-for-it.sh rabbitmq:5672 --strict --timeout=60 &&
      ./start.sh
      "

    working_dir: /app/voiceAI
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      LOG_FILE: "/var/log/app/app.log"
    volumes:
      - app_logs:/var/log/app
      - ./models:/app/models
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - tempo
      - otel-collector
    networks:
      - voice-ai-net

  postgres:
    image: postgres:16
    container_name: voice-ai-postgres
    environment:
      POSTGRES_DB: voice_ai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - voice-ai-net

  pgbouncer:
    image: edoburu/pgbouncer
    container_name: pgbouncer
    depends_on:
      - postgres
    ports:
      - "6432:6432"
    networks:
      - voice-ai-net
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt

  redis:
    image: redis:7
    container_name: voice-ai-redis
    ports:
      - "6379:6379"
    networks:
      - voice-ai-net

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: voice-ai-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   
      - "15672:15672"
    networks:
      - voice-ai-net

  tempo:
    image: grafana/tempo:2.8.2
    container_name: voice-ai-tempo

    command: ["-config.file=/etc/tempo.yaml"]

    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo

    ports:
      - "3200:3200"

    restart: unless-stopped

    networks:
      - voice-ai-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1
    container_name: voice-ai-otel-collector

    command:
      - "--config=/etc/otel-collector.yaml"

    volumes:
      - ./observability/otel-collector.yaml:/etc/otel-collector.yaml:ro
      - app_logs:/var/log/app

    ports:
      - "43170:4317"
      - "43180:4318"
      - "8888:8888"

    depends_on:
      - tempo
      - loki

    restart: unless-stopped

    networks:
      - voice-ai-net

  loki:
    image: grafana/loki:3.5.5
    container_name: voice-ai-loki

    command:
      - "-config.file=/etc/loki/local-config.yaml"

    ports:
      - "3100:3100"

    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki

    restart: unless-stopped

    networks:
      - voice-ai-net

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: voice-ai-prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"

    restart: unless-stopped

    networks:
      - voice-ai-net

  grafana:
    image: grafana/grafana:12.1.1
    container_name: voice-ai-grafana

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    ports:
      - "3001:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards

    depends_on:
      - prometheus
      - tempo
      - loki

    restart: unless-stopped

    networks:
      - voice-ai-net

volumes:
  postgres_data:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
  app_logs:

networks:
  voice-ai-net:
    driver: bridge