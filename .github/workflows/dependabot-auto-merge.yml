name: Dependabot Auto-Merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      # Auto-merge only the safe updates:
      #   - any patch bump (pip or actions)
      #   - minor bumps for GitHub Actions only (low risk)
      # Minor/major pip bumps get a PR that a human reviews and merges.
      - name: Approve and enable auto-merge
        if: >
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          (startsWith(github.head_ref, 'dependabot/github_actions/') &&
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
